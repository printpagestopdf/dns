<!DOCTYPE html>
<html>
<head>
  <title>SlowMail Auth</title>
  <script>
    // OAuth Code aus URL extrahieren und per Custom Scheme zurück zur App
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const state = params.get('state');
    const error = params.get('error');

    if (code || error) {
      // Zurück zur App via Custom Scheme
      const redirect = `comthripperslowmail://auth?code=${code}&state=${state}`;
      window.location.href = redirect;
    }
  </script>
  <meta http-equiv="refresh" content="0">
</head>
<body>
  <p>Authentifizierung läuft...</p>
</body>
</html>
